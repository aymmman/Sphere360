name: Build Sphere360 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found in zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Sphere360-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
